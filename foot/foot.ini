# =========================
#   FOOT 1.25 DARK CONFIG
# =========================

[main]
term=foot
font=JetBrainsMono Nerd Font:size=10
font-bold=JetBrainsMono Nerd Font:weight=bold:size=10
font-italic=JetBrainsMono Nerd Font:slant=italic:size=10
font-bold-italic=JetBrainsMono Nerd Font:weight=bold:slant=italic:size=10
include=~/.config/foot/colors.ini

dpi-aware=yes
pad= 8x5                
resize-delay-ms=100
initial-window-size-chars=110x28
initial-window-mode=windowed

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors]
alpha=0.79

# =========================
# KEYBINDINGS (Functional)
# =========================

[key-bindings]

# Clipboard
clipboard-copy=Control+Shift+c
clipboard-paste=Control+v
primary-paste=Shift+Insert

# Font resize
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

# Scrollback
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Shift+Home
scrollback-end=Shift+End

# Search
search-start=Control+Shift+f

# Spawn new terminal
spawn-terminal=Control+Shift+Return

# Fullscreen toggle
fullscreen=F11


